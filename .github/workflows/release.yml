# Gera o HackCheck.exe e publica no GitHub Releases ao enviar uma tag "v*" (ex.: v0.1.0).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build
        shell: pwsh
        run: ./desktop/build.ps1

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: HackCheck ${{ github.ref_name }} (beta)
          files: desktop/dist/HackCheck.exe
          generate_release_notes: true
          body: |
            Programa para Windows 10/11: verifica a compatibilidade do PC com o macOS, ajuda a gerar a EFI do OpenCore, confere os drivers e cria o pendrive de instalação com o macOS baixado direto da Apple.

            **Como usar:** baixe o `HackCheck.exe` abaixo e abra. Não precisa instalar.

            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o programa ainda não tem assinatura digital).

            Versão beta: cada PC pode exigir ajustes. Confira sempre o guia Dortania.

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: HackCheck-windows
          path: desktop/dist/HackCheck.exe
